name: Build Linux with Naive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: sing-box-extended/go.sum
      - name: Install execution tools
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Prepare pinned Cronet toolchain
        shell: bash
        run: |
          set -euo pipefail
          revision=$(sed -n 's/.*github.com\/sagernet\/cronet-go v[^ ]*-\([0-9a-f]*\)$/\1/p' sing-box-extended/go.mod)
          test -n "$revision"
          git clone --no-checkout https://github.com/sagernet/cronet-go.git "$RUNNER_TEMP/cronet-go"
          git -C "$RUNNER_TEMP/cronet-go" checkout "$revision"
          git -C "$RUNNER_TEMP/cronet-go" submodule update --init --depth 1 naiveproxy
          cd "$RUNNER_TEMP/cronet-go"
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env --export > "$RUNNER_TEMP/cronet-env.sh"
      - name: Build and check static binary
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cronet-env.sh"
          bash scripts/build-naive-linux.sh '${{ matrix.arch }}'
          binary="$PWD/dist/keny.linux-${{ matrix.arch }}"
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then echo 'Unexpected dynamic interpreter'; exit 1; fi
          if readelf -d "$binary" | grep -q NEEDED; then echo 'Unexpected shared-library dependency'; exit 1; fi
          if [[ '${{ matrix.arch }}' == arm64 ]]; then export KENY_TEST_RUNNER=qemu-aarch64; fi
          python3 scripts/test-naive-linux.py "$binary"
      - name: Call regression tests
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/cronet-env.sh"
          cd sing-box-extended
          CGO_ENABLED=1 go test -mod=readonly -ldflags '-linkmode external -extldflags "-static"' -tags with_call,with_quic,with_gvisor,with_utls,with_clash_api,with_wireguard,with_naive_outbound,with_musl ./common/interrupt ./dns/... ./protocol/call ./protocol/group ./route/... ./transport/call/... ./transport/v2raygrpclite github.com/sagernet/sing-vmess/vless github.com/sagernet/wireguard-go/device
      - uses: actions/upload-artifact@v4
        with:
          name: keny-naive-linux-${{ matrix.arch }}
          path: dist/keny.linux-${{ matrix.arch }}
          if-no-files-found: error
