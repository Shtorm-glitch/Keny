name: Stage verified Keny 1.0.3 Linux assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Linux build run for this exact main commit
        required: true
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source build
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('run.json'))
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/naive-linux.yml'
          assert r['head_repository']['full_name']==os.environ['GH_REPO']
          assert r['head_sha']==os.environ['SOURCE_SHA']
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: keny-naive-linux-*
          merge-multiple: true
          path: dist
      - name: Create draft and upload checked Linux binaries
        run: |
          set -euo pipefail
          test -s dist/keny.linux-amd64
          test -s dist/keny.linux-arm64
          chmod +x dist/keny.linux-amd64
          dist/keny.linux-amd64 version | grep '1.14.4-extended-2.7.3-keny.5'
          gh release create v1.0.3 --draft --target "$SOURCE_SHA" --title 'Keny 1.0.3' --notes-file RELEASE_NOTES.md
          gh release upload v1.0.3 dist/keny.linux-amd64 dist/keny.linux-arm64
          gh release view v1.0.3 --json assets --jq '.assets[]|{name,size,digest}'
